name: E2E Tests

on:
  push:
    tags:
      - '*-ux'
      - '*-prerelease'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E UX regression tests / ${{ matrix.stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    strategy:
      fail-fast: false
      matrix:
        include:
          - stage: core-compose-and-sessions
            capture_evidence: true
            specs: >-
              steps/favicon-branding.spec.ts
              steps/us01-morning-triage.spec.ts
              steps/us11-pwa-manifest.spec.ts
              steps/timeline-rendering.spec.ts
              steps/us02-queue-steer.spec.ts
              steps/us16-message-deletion.spec.ts
              steps/us17-compose-instant-visibility.spec.ts
              steps/us24-btw-panel.spec.ts
              steps/theme-tint-commands.spec.ts
              steps/us03-session-switching.spec.ts
              steps/us06-settings.spec.ts
              steps/us09-session-lifecycle.spec.ts
              steps/us12-system-meters.spec.ts
              steps/us12-thoughts-panel.spec.ts
              steps/us13-15-terminal.spec.ts
          - stage: workspace-and-terminal
            specs: >-
              steps/us04-editor.spec.ts
              steps/us08-panes.spec.ts
              steps/us10-workspace-files.spec.ts
          - stage: resilience-and-compaction
            specs: >-
              steps/us05-screenshots.spec.ts
              steps/us07-reconnection.spec.ts
              steps/us20-lightbox-dismissal.spec.ts
              steps/us21-swipe-independence.spec.ts
              steps/us22-settings-layering.spec.ts
              steps/us18-19-compaction-model.spec.ts

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Bun version
        id: bun-version
        run: |
          version="$(tr -d '[:space:]' < BUN_VERSION)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install E2E dependencies
        run: bun install --frozen-lockfile
        working-directory: tests/e2e

      - name: Install Playwright browsers
        uses: ./.github/actions/playwright-cache
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}
          working-directory: tests/e2e
          browsers: chromium
          variant: chromium

      - name: Start deterministic E2E LLM stub
        env:
          PICLAW_E2E_DISPOSABLE: '1'
        run: |
          bun run setup/local-openai-compatible-stub.ts > /tmp/piclaw-e2e-llm-stub.log 2>&1 &
          STUB_PID=$!
          echo "E2E_LLM_STUB_PID=$STUB_PID" >> "$GITHUB_ENV"
          echo "OPENCODE_BASE_URL=http://127.0.0.1:34567/v1" >> "$GITHUB_ENV"
          echo "OPENCODE_MODEL=piclaw-e2e-stub" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:34567/v1/models > /dev/null 2>&1; then
              echo "LLM stub ready after ${i}s"
              exit 0
            fi
            if ! kill -0 "$STUB_PID" 2>/dev/null; then
              echo "LLM stub exited before becoming ready" >&2
              cat /tmp/piclaw-e2e-llm-stub.log >&2 || true
              exit 1
            fi
            sleep 1
          done
          echo "Timed out waiting for LLM stub" >&2
          cat /tmp/piclaw-e2e-llm-stub.log >&2 || true
          exit 1
        working-directory: tests/e2e

      - name: Configure deterministic E2E LLM provider
        run: |
          export PICLAW_E2E_FIXTURE_ROOT=$(mktemp -d /tmp/piclaw-e2e-fixture.XXXXXX)
          printf 'piclaw disposable e2e\n' > "$PICLAW_E2E_FIXTURE_ROOT/.piclaw-e2e-fixture"
          export PICLAW_WORKSPACE="$PICLAW_E2E_FIXTURE_ROOT/workspace"
          export PICLAW_PI_AGENT_DIR="$PICLAW_E2E_FIXTURE_ROOT/profile"
          export PICLAW_E2E_DISPOSABLE=1
          mkdir -p "$PICLAW_PI_AGENT_DIR" "$PICLAW_WORKSPACE"
          echo "PICLAW_E2E_FIXTURE_ROOT=$PICLAW_E2E_FIXTURE_ROOT" >> $GITHUB_ENV
          echo "PICLAW_WORKSPACE=$PICLAW_WORKSPACE" >> $GITHUB_ENV
          echo "PICLAW_PI_AGENT_DIR=$PICLAW_PI_AGENT_DIR" >> $GITHUB_ENV
          echo "PICLAW_E2E_DISPOSABLE=1" >> $GITHUB_ENV
          bun run setup/configure-test-instance.ts
        working-directory: tests/e2e

      - name: Start PiClaw instance
        run: |
          # Generate a test internal secret
          export PICLAW_INTERNAL_SECRET=$(openssl rand -hex 16)
          echo "::add-mask::$PICLAW_INTERNAL_SECRET"
          echo "PICLAW_INTERNAL_SECRET=$PICLAW_INTERNAL_SECRET" >> $GITHUB_ENV

          # Start piclaw in background with test config
          mkdir -p "$PICLAW_WORKSPACE/.piclaw"

          # Write minimal config and seed one known root file for workspace/editor UX tests.
          (umask 077; printf '%s\n' '{"sessionAutoRotate":true}' > "$PICLAW_WORKSPACE/.piclaw/config.json")
          chmod 600 "$PICLAW_WORKSPACE/.piclaw/config.json"
          cp AGENTS.md "$PICLAW_WORKSPACE/AGENTS.md"

          # Start server
          export PICLAW_WEB_PORT=3000
          echo "PICLAW_WEB_PORT=$PICLAW_WEB_PORT" >> $GITHUB_ENV
          bun run start > "$PICLAW_WORKSPACE/piclaw-e2e-server.log" 2>&1 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

          # Wait for server to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Server process exited before becoming ready" >&2
              exit 1
            fi
            sleep 1
          done

      - name: Validate test environment
        run: bun run setup/validate-test-config.ts
        working-directory: tests/e2e
        env:
          PICLAW_E2E_URL: http://localhost:3000
          PICLAW_INTERNAL_SECRET: ${{ env.PICLAW_INTERNAL_SECRET }}
          PICLAW_E2E_INTERNAL_SECRET: ${{ env.PICLAW_INTERNAL_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run E2E tests (${{ matrix.stage }})
        run: bun run test -- ${{ matrix.specs }} --project=desktop-chrome
        working-directory: tests/e2e
        env:
          PICLAW_E2E_DISPOSABLE: '1'
          PICLAW_E2E_URL: http://localhost:3000
          PICLAW_INTERNAL_SECRET: ${{ env.PICLAW_INTERNAL_SECRET }}
          PICLAW_E2E_INTERNAL_SECRET: ${{ env.PICLAW_INTERNAL_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture representative release layouts
        if: success() && matrix.capture_evidence
        run: bun run scripts/capture-release-evidence.ts
        working-directory: tests/e2e
        env:
          PICLAW_E2E_DISPOSABLE: '1'
          PICLAW_E2E_URL: http://localhost:3000
          PICLAW_INTERNAL_SECRET: ${{ env.PICLAW_INTERNAL_SECRET }}
          PICLAW_E2E_INTERNAL_SECRET: ${{ env.PICLAW_INTERNAL_SECRET }}

      - name: Generate PDF report
        if: always()
        run: bun run report
        working-directory: tests/e2e

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-report-${{ matrix.stage }}
          path: |
            tests/e2e/reports/piclaw-e2e-report.pdf
            tests/e2e/reports/piclaw-e2e-report.html
            tests/e2e/reports/results.json
            tests/e2e/reports/progress.jsonl
            tests/e2e/reports/incomplete.json
            tests/e2e/reports/evidence/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-results-${{ matrix.stage }}
          path: tests/e2e/test-results/
          retention-days: 7

      - name: Stop server
        if: always()
        run: |
          kill $SERVER_PID 2>/dev/null || true
          kill $E2E_LLM_STUB_PID 2>/dev/null || true
