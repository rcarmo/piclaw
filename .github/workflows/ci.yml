name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'runtime/web/**'
      - 'runtime/src/**'
      - 'runtime/test/**'
      - 'runtime/extensions/**'
      - 'runtime/scripts/**'
      - 'package.json'
      - 'bun.lock'
      - 'Makefile'
      - 'tsconfig*.json'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'runtime/web/**'
      - 'runtime/src/**'
      - 'runtime/test/**'
      - 'runtime/extensions/**'
      - 'runtime/scripts/**'
      - 'package.json'
      - 'bun.lock'
      - 'Makefile'
      - 'tsconfig*.json'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

# A newer SHA for the same PR/ref supersedes its previous CI result. Tag and
# release workflows intentionally have no cancellation concurrency group.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: Build web UI + frontend regression checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Bun version
        id: bun-version
        run: |
          version="$(tr -d '[:space:]' < BUN_VERSION)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run canonical fast CI contract
        run: make ci-fast

      - name: Smoke-test isolated Git global install
        run: bun run smoke:repo-install
