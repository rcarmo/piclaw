  Served by: channels/web/http/static.ts at the root URL.

  Bundles:
  ────────
  The authenticated SPA is shipped as app bundles:
    - /static/classic/dist/app.bundle.js
    - /static/classic/dist/app.bundle.css
  Login is a separate minimal bundle set:
    - /static/common/dist/login.bundle.js (loaded only by login.html)
    - /static/common/dist/login.bundle.css (loaded only by login.html)

  Vendor JS globals (marked, KaTeX, Mermaid) remain separate prebuilt files.
  App CSS is bundled into /static/classic/dist/*.bundle.css; login CSS uses /static/common/dist/.
  request-router-service.ts auth-gates /static/classic/dist/app.bundle.{js,css} and only
  exposes /static/common/dist/login.bundle.{js,css} to unauthenticated visitors.
-->

    <script>
        // Mobile standalone PWA scale guard: apply the saved display scale before CSS loads.
        (function() {
            try {
                var userAgent = navigator.userAgent || '';
                var maxTouchPoints = Number(navigator.maxTouchPoints || 0);
                var isMobile = /Android|webOS|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(userAgent) || maxTouchPoints > 1;
                var standalone = Boolean(navigator.standalone);
                if (!standalone && window.matchMedia) {
                    standalone = window.matchMedia('(display-mode: standalone)').matches ||
                        window.matchMedia('(display-mode: fullscreen)').matches ||
                        window.matchMedia('(display-mode: minimal-ui)').matches;
                }
                var raw = localStorage.getItem('piclawPwaDisplayScalePercent');
                var parsed = raw && raw.trim().endsWith('%') ? Number(raw.trim().slice(0, -1)) : Number(raw);
                if (parsed > 0 && parsed <= 2) parsed *= 100;
                if (!Number.isFinite(parsed) || parsed <= 0) parsed = 100;
                var percent = Math.min(115, Math.max(20, Math.round(parsed)));
                if (isMobile && standalone && percent !== 100) {
                    var scale = (percent / 100).toFixed(2).replace(/0+$/, '').replace(/\.$/, '');
                    var viewport = document.getElementById('piclaw-viewport') || document.querySelector('meta[name="viewport"]');
                    if (viewport) {
                        viewport.setAttribute('content', 'width=device-width, initial-scale=' + scale + ', minimum-scale=' + scale + ', maximum-scale=' + scale + ', user-scalable=no, viewport-fit=cover');
                    }
                }
            } catch(e) {}
        })();
    </script>

    <div id="app">
        <div style="padding: 20px; text-align: center; color: var(--text-secondary, #888);">Loading...</div>
    </div>
    <script>
        window.__PICLAW_APP_BOOTED__ = false;
        window.onerror = function(msg, url, line, col, error) {
            var text = String((error && error.message) || msg || '');
            if (/ResizeObserver loop (completed with undelivered notifications|limit exceeded)/i.test(text)) {
                return true;
            }
            if (window.__PICLAW_APP_BOOTED__) {
                return false;
            }
            var app = document.getElementById('app');
            if (app) {
                app.innerHTML = '<pre style="padding:20px;color:red;">Error: ' + msg + '\nLine: ' + line + '</pre>';
            }
            return false;
        };
    </script>

    <script>
      // Lazy-load katex and mermaid after the app has rendered its first frame.
      // These are heavy vendor scripts (266KB + 1.5MB) only needed when rendering
      // math blocks or mermaid diagrams. The markdown renderer guards with
      // window.katex / window.beautifulMermaid checks, so posts rendered before
      // load complete simply skip those features until a re-render.
      function loadDeferredVendorScripts() {
        var s1 = document.createElement('script');
        s1.src = '/static/common/js/vendor/katex.min.js';
        document.head.appendChild(s1);
        var s2 = document.createElement('script');
        s2.src = '/static/common/js/vendor/beautiful-mermaid.js';
        document.head.appendChild(s2);
      }
      // Wait for the app to paint, then load after a short delay
      if (document.readyState === 'complete') {
        setTimeout(loadDeferredVendorScripts, 2000);
      } else {
        window.addEventListener('load', function() {
          setTimeout(loadDeferredVendorScripts, 1500);
        }, { once: true });
      }
    </script>
